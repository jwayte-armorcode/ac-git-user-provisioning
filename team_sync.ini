# tenantRole assigned to newly-created ArmorCode users provisioned from SCM
# repo members. Must be a valid role name in the tenant — check GET /user/roles
# (e.g. Developer, Admin, DevOps, Security Engineer, Read Only, or a Custom_*
# role). A wrong value returns 400 "Provided Tenant Role Not Found".
#
# [armorcode] applies to both sources. To give one SCM a different role, add a
# [github] or [gitlab] section — the per-source section wins over [armorcode].
[armorcode]
default_role = Developer

# [github]
# default_role = Developer

# [gitlab]
# default_role = Read Only
